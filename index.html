<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Zendo Mijozlar">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111113" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Zendo Mijozlar</title>
<style>
/* Layout: sidebar + content on wide screens (>=900px); single column with bottom tab bar on phones. */
:root{
  --bg:#f5f5f7;--card:#fff;--side:#ebecef;--ink:#1d1d1f;--ink2:#6e6e73;--ink3:#aeaeb2;--sep:rgba(60,60,67,.13);--fill:rgba(118,118,128,.1);--fill2:rgba(118,118,128,.16);--inset:#f5f5f7;
  --accent:#0a8577;--accent2:#12998a;--accent-t:rgba(10,133,119,.11);--on-accent:#fff;
  --red:#ff3b30;--red-t:rgba(255,59,48,.12);--red-x:#d70015;
  --orange:#ff9500;--orange-t:rgba(255,149,0,.14);--orange-x:#b25000;
  --green:#34c759;--green-t:rgba(52,199,89,.15);--green-x:#1d7a36;
  --blue:#007aff;--blue-t:rgba(0,122,255,.11);--blue-x:#0062cc;
  --purple:#af52de;--purple-t:rgba(175,82,222,.13);--purple-x:#8433ab;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Segoe UI",Arial,sans-serif;
  --round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
  --shadow:0 0 0 .5px rgba(0,0,0,.05),0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.05);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#111113;--card:#1e1e21;--side:#19191b;--ink:#f5f5f7;--ink2:#a1a1a6;--ink3:#636366;--sep:rgba(120,120,128,.3);--fill:rgba(118,118,128,.2);--fill2:rgba(118,118,128,.28);--inset:#27272a;
    --accent:#2cc5b3;--accent2:#35d1bf;--accent-t:rgba(44,197,179,.16);--on-accent:#04211d;
    --red:#ff453a;--red-t:rgba(255,69,58,.18);--red-x:#ff6b62;
    --orange:#ff9f0a;--orange-t:rgba(255,159,10,.18);--orange-x:#ffb340;
    --green:#30d158;--green-t:rgba(48,209,88,.18);--green-x:#4fdc75;
    --blue:#0a84ff;--blue-t:rgba(10,132,255,.2);--blue-x:#5aa9ff;
    --purple:#bf5af2;--purple-t:rgba(191,90,242,.2);--purple-x:#d18cf7;
    --shadow:0 0 0 .5px rgba(255,255,255,.07);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.4 var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
a{color:var(--accent);text-decoration:none}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{flex:none}

/* ---------- shell ---------- */
.app{display:flex;min-height:100vh}
.side{display:none}
.content{flex:1;min-width:0;padding:0 16px calc(104px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:flex-end;gap:12px;padding:calc(14px + env(safe-area-inset-top)) 0 12px}
.top .tt{min-width:0;flex:1}
.eb{font-size:12px;font-weight:600;color:var(--ink2);letter-spacing:.03em;text-transform:uppercase;min-height:16px}
h1{margin:0;font-size:30px;line-height:1.12;font-weight:700;letter-spacing:-.025em}
#gsearch{display:none}
.fab{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:8;height:48px;padding:0 20px;border-radius:99px;background:var(--accent);color:var(--on-accent);font-weight:600;box-shadow:0 6px 20px rgba(10,133,119,.35)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:9;background:color-mix(in srgb,var(--card) 86%,transparent);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:.5px solid var(--sep);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 2px;font-size:11px;font-weight:500;color:var(--ink2);border-radius:10px}
nav.tabs svg{width:24px;height:24px}
nav.tabs button[aria-pressed="true"]{color:var(--accent)}
body.auth .side,body.auth nav.tabs,body.auth .fab,body.auth #gsearch{display:none!important}

.notice{background:var(--orange-t);color:var(--orange-x);border-radius:12px;padding:10px 14px;font-size:14px;margin:0 0 14px}
.empty{color:var(--ink2);text-align:center;padding:28px 16px;margin:0}
.empty.sm{padding:12px 20px 16px;text-align:left;font-size:14px}
.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.ct{display:flex;align-items:center;gap:10px;padding:16px 18px 10px}
.ct h3{margin:0;font-size:17px;font-weight:600;letter-spacing:-.01em}
.ct .more,.ct .seg{margin-left:auto}
.cap{font-size:12px;font-weight:600;color:var(--ink2);letter-spacing:.03em;text-transform:uppercase}
.cap.red{color:var(--red-x)} .cap.pad{padding:18px 0 8px;display:block}
.linkbtn{color:var(--accent);font-weight:500;font-size:14px} .linkbtn.del{color:var(--red-x)}
.seg{display:inline-flex;background:var(--fill);border-radius:9px;padding:2px;font-size:13px;font-weight:500}
.seg button{padding:5px 12px;border-radius:7px;color:var(--ink2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
.pill{flex:none;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap;background:var(--fill);color:var(--ink2)}
.pill.red{background:var(--red-t);color:var(--red-x)} .pill.or{background:var(--orange-t);color:var(--orange-x)} .pill.bl{background:var(--blue-t);color:var(--blue-x)} .pill.gr{background:var(--green-t);color:var(--green-x)} .pill.pu{background:var(--purple-t);color:var(--purple-x)} .pill.ac{background:var(--accent-t);color:var(--accent)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
.av{border-radius:50%;display:grid;place-items:center;color:#fff;font:600 13px var(--round);flex:none;width:36px;height:36px}
.av.big{width:68px;height:68px;font-size:25px}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}

/* ---------- rows ---------- */
.r{display:flex;align-items:center;gap:12px;padding:9px 18px;min-height:58px;position:relative;width:100%}
.r+.r::before,.inl+.r::before{content:"";position:absolute;left:52px;right:0;top:0;border-top:.5px solid var(--sep)}
.r.sel{background:var(--accent-t)} .r.sel::before,.r.sel+.r::before{display:none}
[data-act="toggle"],.cr{cursor:pointer}
.ck{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--ink3);flex:none;display:grid;place-items:center;color:#fff;font:700 12px var(--round)}
.ck.on{background:var(--green);border-color:var(--green)}
.rt{min-width:0;flex:1;display:block}
.rt>b{display:block;font-weight:600;font-size:15px;letter-spacing:-.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt>span{display:block;color:var(--ink2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r.dn .rt>b{color:var(--ink2);font-weight:500} .evr.dn .rt>b{text-decoration:line-through}
.evr.late .rt>span{color:var(--red-x)}
.ph{display:none;width:136px;text-align:right;color:var(--ink2);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.chev{width:7px;height:12px;color:var(--ink3)}
.tail{font-size:12.5px;color:var(--ink2);white-space:nowrap;flex:none}
.rs{display:flex;align-items:center;gap:8px;padding:14px 18px 6px}
.rs em{font-style:normal;color:var(--ink3);font-weight:600;font-size:12px}
.r+.rs,.empty+.rs,.inl+.rs{border-top:.5px solid var(--sep);margin-top:4px}
.inl{background:var(--inset);border-top:.5px solid var(--sep)}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:16px}
.ringc{grid-column:1/-1;display:flex;align-items:center;gap:18px;padding:16px 18px}
.ring{position:relative;width:88px;height:88px;flex:none;display:block;color:var(--accent)}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);display:block}
.ring .rv{position:absolute;inset:0;display:grid;place-items:center;font:700 26px var(--round);letter-spacing:-.02em;color:var(--ink)}
.ring .rv small{font:600 13px var(--round);color:var(--ink2)}
.ring.sm{width:48px;height:48px} .ring.sm .rv{font-size:12px;font-weight:600}
.lg{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;flex:1;min-width:0}
.lg p{margin:0 0 4px;grid-column:1/3;font-weight:600;font-size:15px}
.lg span{display:flex;align-items:center;gap:7px;color:var(--ink2);font-size:13px} .lg span b{margin-left:auto;color:var(--ink);font:600 14px var(--round)}
.tile{padding:14px;display:flex;flex-direction:column;gap:2px;text-align:left;min-height:108px}
.tile .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:#fff;margin-bottom:auto} .tile .ic svg{width:16px;height:16px}
.tile b{font:700 28px/1 var(--round);letter-spacing:-.02em;margin-top:10px} .tile b small{font-size:15px;color:var(--ink2);font-weight:600} .tile b.bad{color:var(--red-x)}
.tile>span:last-child{color:var(--ink2);font-size:12.5px}

/* ---------- bugun ---------- */
.bg2{display:flex;flex-direction:column;gap:16px}
.bg2>.col{display:contents}
.bg2 .kc{order:1} .bg2 .qa{order:2} .bg2 .pa{order:3} .bg2 .dc{display:none}
.det{padding:18px}
.det h3{margin:10px 0 2px;font-size:22px;letter-spacing:-.02em;font-weight:700}
.det>p{margin:0 0 12px;color:var(--ink2);font-size:14px}
.note{background:var(--fill);border-radius:11px;padding:9px 12px;font-size:13px;margin-bottom:14px}
.cbtn{height:50px;border-radius:14px;background:linear-gradient(180deg,var(--accent2),var(--accent));color:var(--on-accent);display:flex;align-items:center;gap:10px;padding:0 18px;font-weight:600;font-size:16px;box-shadow:0 4px 14px rgba(10,133,119,.3);margin-bottom:16px}
.cbtn svg{width:18px;height:18px} .cbtn em{margin-left:auto;font-style:normal;font-weight:500;opacity:.85;font-size:14px;font-variant-numeric:tabular-nums}
.cbtn[aria-disabled="true"]{background:var(--fill);color:var(--ink3);box-shadow:none;pointer-events:none}
.outs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 14px}
.outs button{min-height:38px;border-radius:10px;background:var(--fill);display:flex;align-items:center;justify-content:center;gap:7px;font-weight:500;font-size:13px;padding:4px 6px;text-align:center}
.outs button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.links{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:14px}
.saved{color:var(--ink2);font-size:12.5px;min-height:16px;margin-top:6px}

/* ---------- forms ---------- */
.lbl{display:block;font-size:12.5px;font-weight:600;color:var(--ink2);margin:0 0 5px}
.f{display:block;width:100%;border:0;background:var(--fill);border-radius:11px;padding:10px 12px;font-size:15px;outline-offset:0;min-height:42px}
textarea.f{min-height:76px;resize:vertical;margin-bottom:0}
.det .f{margin-bottom:12px}
.f::placeholder{color:var(--ink3)}
select.f{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink2) 50%),linear-gradient(135deg,var(--ink2) 50%,transparent 50%);background-position:calc(100% - 17px) 18px,calc(100% - 12px) 18px;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
form.list{display:flex;flex-direction:column;gap:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.req{color:var(--red-x)}
.err{color:var(--red-x);font-size:13.5px;min-height:0} .err:empty{display:none}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.primary{height:44px;padding:0 20px;border-radius:12px;background:var(--accent);color:var(--on-accent);font-weight:600}
.ghost{height:44px;padding:0 16px;border-radius:12px;background:var(--fill);font-weight:500}
.danger{height:44px;padding:0 16px;border-radius:12px;color:var(--red-x);font-weight:500;margin-left:auto}
.danger.confirm{background:var(--red);color:#fff}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{padding:6px 12px;border-radius:99px;background:var(--fill);font-size:13px;font-weight:500;color:var(--ink2)}
.tag[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.picker{background:var(--card);border-radius:12px;box-shadow:var(--shadow);margin-top:6px;max-height:220px;overflow:auto}
.picker button{display:block;width:100%;padding:10px 14px;border-bottom:.5px solid var(--sep)}
.picked{display:flex;justify-content:space-between;align-items:center;background:var(--fill);border-radius:11px;padding:10px 12px;font-weight:500}
.ev-sub{color:var(--ink2);font-size:13.5px}
.login{max-width:400px;margin:8vh auto 0;padding:28px 24px}
.login .logo{width:60px;height:60px;border-radius:16px;background:linear-gradient(145deg,#19a898,#07695e);color:#fff;display:grid;place-items:center;font:700 30px var(--round);margin:0 auto 14px;box-shadow:0 6px 18px rgba(10,133,119,.35)}
.login h2{text-align:center;margin:0 0 20px;font-size:22px;letter-spacing:-.02em}

/* ---------- sheets ---------- */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom));position:relative}
.sheet.tall{height:94vh;max-width:760px}
.sheet-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
.sheet-top h2{margin:0;font-size:21px;letter-spacing:-.02em}
.x{width:32px;height:32px;border-radius:50%;background:var(--fill2);font-size:19px;line-height:1;color:var(--ink2);display:grid;place-items:center;flex:none}

/* ---------- kalendar ---------- */
.chipsrow{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.chip{flex:none;padding:7px 13px;border-radius:99px;background:var(--fill);color:var(--ink2);font-size:13.5px;font-weight:500;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.chip.dayc{border-radius:14px;padding:7px 12px;text-align:center;background:var(--card);box-shadow:var(--shadow);min-width:52px;position:relative}
.chip.dayc b{display:block;font:600 18px var(--round);color:var(--ink)} .chip.dayc.today b{color:var(--accent)}
.chip.dayc[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)} .chip.dayc[aria-pressed="true"] b{color:var(--on-accent)}
.chip.dayc small{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;border-radius:99px;background:var(--red);color:#fff;font-size:10.5px;font-weight:700;line-height:17px;padding:0 4px}
.tl-date{padding:12px 18px 2px;font-size:12px;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.03em}
.ktools{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.ktools>b{font-size:17px;letter-spacing:-.01em}
.tb{display:inline-flex;background:var(--card);border-radius:10px;box-shadow:var(--shadow);overflow:hidden}
.tb button{height:34px;padding:0 13px;font-weight:500;white-space:nowrap} .tb button+button{border-left:.5px solid var(--sep)}
.kal{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
.wkh{display:grid;grid-template-columns:58px repeat(7,minmax(0,1fr));border-bottom:.5px solid var(--sep);padding:10px 0 8px}
.wkh button{text-align:center;color:var(--ink2);font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;min-width:0}
.wkh button b{display:block;margin:3px auto 0;width:34px;height:34px;border-radius:50%;font:500 19px/34px var(--round);color:var(--ink);letter-spacing:0}
.wkh .td b{background:var(--accent);color:var(--on-accent);font-weight:600} .wkh .ps,.wkh .ps b{color:var(--ink3)}
.wkh .sel:not(.td) b{background:var(--fill2)}
.wkh i{display:block;font-style:normal;text-transform:none;letter-spacing:0;font-size:11px;font-weight:600;color:#fff;border-radius:5px;margin:3px 4px 0;padding:1px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wkg{display:grid;grid-template-columns:58px repeat(7,minmax(0,1fr))}
.tcol{position:relative} .tcol span{position:absolute;right:10px;transform:translateY(-8px);font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.dcol{position:relative;border-left:.5px solid var(--sep);background:repeating-linear-gradient(180deg,transparent 0 55.5px,var(--sep) 55.5px 56px);cursor:cell}
.bk{position:absolute;left:3px;right:3px;border-radius:8px;padding:5px 8px;font-size:11.5px;line-height:1.3;overflow:hidden;background:var(--fill);color:var(--ink2);pointer-events:none}
.bk b{display:block;font-weight:600;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .bk.c{background:var(--accent-t);color:var(--accent)} .bk.dn{opacity:.5}
.evb{position:absolute;border-radius:8px;padding:5px 8px;font-size:11.5px;line-height:1.3;z-index:2;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.14);color:#fff;text-align:left}
.evb b{display:block;font-weight:600;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .evb.dn{opacity:.5;text-decoration:line-through}
.mini{padding:16px 16px 12px}
.mh{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:15px;margin-bottom:8px}
.mh button{width:28px;height:28px;border-radius:8px;color:var(--accent);font-size:18px}
.mg{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;row-gap:2px}
.mg i{font:600 10.5px var(--font);font-style:normal;color:var(--ink3);padding-bottom:4px}
.mg button{height:32px;width:32px;margin:0 auto;border-radius:50%;position:relative;font:500 13.5px var(--round);text-align:center}
.mg .t{color:var(--accent);font-weight:700} .mg .s{background:var(--accent);color:var(--on-accent);font-weight:700} .mg .p{color:var(--ink3)}
.mg .e::after{content:"";position:absolute;left:50%;bottom:3px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--blue)} .mg .s.e::after{background:var(--on-accent)}

/* ---------- mijozlar ---------- */
.srch{background:var(--fill2)}
.mlist .tools{padding:14px 14px 10px}
.mlist .chipsrow{padding:0 14px 12px}
.cr{min-height:62px} .cr::before{left:66px!important}
.mdet{padding:0 18px 22px}
.prof{padding:20px 0 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:relative}
.prof .pn{min-width:0;flex:1 1 200px}
.prof h3{margin:0 0 6px;font-size:24px;letter-spacing:-.02em;line-height:1.15}
.prof p{margin:0;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.prof .x{position:absolute;top:0;right:0}
.acts{display:flex;gap:8px;flex:1 1 100%}
.act{flex:1;padding:9px 0 7px;border-radius:13px;background:var(--fill);text-align:center;color:var(--accent);font-size:11.5px;font-weight:500;max-width:90px}
.act svg{width:19px;height:19px;display:block;margin:0 auto 4px}
.act.p{background:var(--accent);color:var(--on-accent);box-shadow:0 3px 10px rgba(10,133,119,.3)}
.act[aria-disabled="true"]{background:var(--fill);color:var(--ink3);box-shadow:none;pointer-events:none}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv div{background:var(--inset);border-radius:14px;padding:12px 14px;min-width:0} .sheet .kv div{background:var(--card)}

<script>
/* ---------- constants ---------- */
const STATUSES = [
  {k:"kut", l:"Kutilmoqda"}, {k:"gap", l:"Gaplashildi"}, {k:"muammo", l:"Muammo bor"},
  {k:"zoom", l:"Zoom/demo"}, {k:"tolov", l:"To'lov/yillik"}, {k:"kot", l:"Ko'tarmadi"}, {k:"rad", l:"Rad etdi"}
];
const ST_LABEL = Object.fromEntries(STATUSES.map(s=>[s.k,s.l]));
const GROUPS = {support:"Shoshilinch support", yangi:"Yangi ro'yxatdan o'tgan", faol:"Faol mijoz", ketgan:"Ketgan mijoz", qayta:"Qayta urinish", lid:"Sotuv lidi", vazifa:"Vazifa"};
const CST = {faol:"Faol mijoz", yangi:"Yangi ro'yxatdan o'tgan", lid:"Sotuv lidi", ketgan:"Ketgan mijoz"};
const DONE = new Set(["gap","muammo","zoom","tolov","rad"]);
const EV_TYPES = {call:"Qo'ng'iroq", zoom:"Zoom / demo", meet:"Uchrashuv", task:"Vazifa", pay:"To'lov", support:"Support"};
const EV_DEF = {call:"Qo'ng'iroq qilish", zoom:"Zoom / demo", meet:"Uchrashuv", task:"", pay:"To'lovni eslatish", support:"Muammoni hal qilish"};
const H_TYPES = {call:"Qo'ng'iroq", zoom:"Zoom", meet:"Uchrashuv", tg:"Telegram", note:"Izoh", pay:"To'lov"};
const TOPICS = ["SMS","Xodimlar","Kassa","To'lov","Hisobot","Ombor","Laboratoriya","Bemorlar","Muammo yo'q"];
const MONTHS = ["yan","fev","mar","apr","may","iyun","iyul","avg","sen","okt","noy","dek"];
const WD = ["Yak","Dush","Sesh","Chor","Pay","Jum","Shan"];

/* ---------- state ---------- */
const state = {
  db:null, plan:null, calls:new Map(), clients:new Map(), events:new Map(),
  tab:"bugun", rejaView:"kun", day:null, q:"", st:"all", open:null, confirmDel:null,
  cq:"", cf:"all", calDay:null, sheet:null, hist:[], histUnsub:null, histFor:null,
  pendingRender:false, loaded:{plan:false,clients:false,events:false}
};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const dstr = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const todayStr = () => dstr(new Date());
const parseD = s => { const [y,m,d]=String(s).slice(0,10).split("-").map(Number); return new Date(y,(m||1)-1,d||1); };
const addDays = (s,n) => { const d=parseD(s); d.setDate(d.getDate()+n); return dstr(d); };
const daysBetween = (a,b) => Math.round((parseD(b)-parseD(a))/86400000);
const dLabel = s => { if(!s) return ""; const d=parseD(s); return `${d.getDate()}-${MONTHS[d.getMonth()]}`; };
const dLong = s => { const d=parseD(s); return `${WD[d.getDay()]}, ${d.getDate()}-${MONTHS[d.getMonth()]}`; };
const nowTime = () => { const d=new Date(); return pad(d.getHours())+":"+pad(d.getMinutes()); };
const money = (n,cur) => { if(n==null||n==="") return "—"; const v=Number(n); if(cur==="USD") return "$"+v.toLocaleString("en-US"); return Math.round(v).toLocaleString("ru-RU").replace(/,/g," ")+" so'm"; };
const uid = p => p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function setNotice(msg){ $("#notice").innerHTML = msg ? `<div class="notice">${esc(msg)}</div>` : ""; }
function failMsg(e){ return e && (e.code==="invalid_argument"||e.code==="42501") ? "Saqlab bo'lmadi: bu sahifada yozish huquqingiz yo'q." : "Saqlab bo'lmadi, internetni tekshirib qayta urinib ko'ring."; }

/* ---------- derived ---------- */
function payInfo(c){
  const b=c.billing||{};
  const out={label:null, cls:""};
  if(b.outstanding>0){ out.label="Qarz "+money(b.outstanding,b.currency); out.cls="p-bad"; return out; }
  if(b.trial){ out.label="Hali to'lamagan"; out.cls="p-warn"; return out; }
  if(b.noSubscription){ out.label="Obuna yo'q"; out.cls="p-warn"; return out; }
  if(b.paidUntil){
    const left=daysBetween(todayStr(), b.paidUntil);
    if(left<0){ out.label="Muddati o'tgan"; out.cls="p-bad"; }
    else if(left<=7){ out.label=`To'lov ${left} kunda`; out.cls="p-warn"; }
    else { out.label=dLabel(b.paidUntil)+" gacha"; out.cls="p-ok"; }
  }
  return out;
}
function lastContact(c){ return c.lastContactAt || null; }
function clientForCall(call){
  if(call.clientId && state.clients.has(call.clientId)) return state.clients.get(call.clientId);
  if(call.site){ for(const c of state.clients.values()) if(c.domain===call.site) return c; }
  const n=(call.name||"").toLowerCase().replace(/\s*\(.*\)\s*/g,"").trim();
  for(const c of state.clients.values()){ const cn=(c.name||"").toLowerCase().replace(/\s*\(.*\)\s*/g,"").trim(); if(cn && cn===n) return c; }
  return null;
}
function eventsOn(day){ return [...state.events.values()].filter(e=>e.date===day).sort((a,b)=>(a.time||"99").localeCompare(b.time||"99")); }
function isoWeek(s){ const d=parseD(s); d.setDate(d.getDate()-((d.getDay()+6)%7)+3); const y=d.getFullYear(), j4=new Date(y,0,4); return y+"-W"+pad(1+Math.round(((d-j4)/86400000-3+((j4.getDay()+6)%7))/7)); }
function weekMon(w){ const [y,n]=String(w).split("-W").map(Number), j4=new Date(y,0,4); return dstr(new Date(y,0,4-((j4.getDay()+6)%7)+(n-1)*7)); }
const weekDays=w=>{ const m=weekMon(w); return [...Array(7)].map((_,i)=>addDays(m,i)); };
const weekShift=(w,n)=>isoWeek(addDays(weekMon(w),7*n));
function weekRange(w){ const d=weekDays(w), a=parseD(d[0]), z=parseD(d[6]); return a.getMonth()===z.getMonth() ? `${a.getDate()}–${z.getDate()}.${pad(z.getMonth()+1)}` : `${a.getDate()}.${pad(a.getMonth()+1)}–${z.getDate()}.${pad(z.getMonth()+1)}`; }
const viewPlan=()=>state.plans.get(state.rweek) || (state.plan&&state.plan.week===state.rweek?state.plan:null);
state.plans=new Map(); state.curWeek=isoWeek(todayStr()); state.rweek=state.curWeek;
function callsFor(day){ return [...state.calls.values()].filter(c=>day?c.day===day:c.week===state.rweek).sort((a,b)=>(a.day||"").localeCompare(b.day||"")||(a.ord||0)-(b.ord||0)); }
function counts(list){ const r={total:list.length,done:0,kot:0,kut:0,muammo:0,tolov:0,zoom:0}; for(const c of list){const s=c.st||"kut"; if(DONE.has(s)) r.done++; if(s in r) r[s]++;} return r; }

/* ---------- render: shared pieces ---------- */
state.selClient=null; state.bq="kut";
const WIDE=window.matchMedia("(min-width:900px)");
const isWide=()=>WIDE.matches;
WIDE.addEventListener("change",()=>{
  if(!state.db) return;
  if(state.sheet&&state.sheet.kind==="client"&&isWide()){ const id=state.sheet.id; closeSheet(); openClient(id); }
  else doRender();
});
const WDF=["Yakshanba","Dushanba","Seshanba","Chorshanba","Payshanba","Juma","Shanba"];
const MF=["yanvar","fevral","mart","aprel","may","iyun","iyul","avgust","sentabr","oktabr","noyabr","dekabr"];
const cap1=s=>s.charAt(0).toUpperCase()+s.slice(1);
const dFull=s=>{ const d=parseD(s); return `${WDF[d.getDay()]}, ${d.getDate()}-${MF[d.getMonth()]}`; };
const ICON={

const HH=52, H0=0, H1=24;
const minToT=m=>pad(Math.floor(m/60)%24)+":"+pad(m%60);
const evEnd=e=>{ const a=tmin(e.time), z=tmin(e.timeEnd); return a==null?null:(z!=null&&z>a?z:a+60); };
const evSpan=e=>e.time?e.time+(e.timeEnd?"–"+e.timeEnd:""):"";
const evCls=e=>"t-"+(EVC[e.type]?e.type:"task");
const tmin=s=>{ const m=/^(\d{1,2}):(\d{2})/.exec(String(s||"").trim()); return m?(+m[1])*60+(+m[2]):null; };
function dayCard(){
  const evs=eventsOn(state.calDay);
  return `<div class="card"><div class="ct"><h3>${esc(dFull(state.calDay))}</h3><button class="linkbtn more" data-act="newev">+ Qo'shish</button></div>
    ${evs.length?evs.map(evRow).join(""):`<p class="empty sm">Bu kunga hech narsa yo'q.</p>`}</div>`;
}
function upcomingCard(){
  const up=[...state.events.values()].filter(e=>!e.done && e.date>state.calDay).sort(byWhen).slice(0,12);
  if(!up.length) return "";
  let h=`<div class="card"><div class="ct"><h3>Keyingi uchrashuvlar</h3></div>`, cur=null;
  for(const e of up){ if(e.date!==cur){ cur=e.date; h+=`<div class="tl-date">${esc(dFull(e.date))}</div>`; } h+=evRow(e); }
  return h+`</div>`;
}
state.calView="week";
const WD1=["Dush","Sesh","Chor","Pay","Jum","Shan","Yak"];
function timeGrid(days){
  const t=todayStr(), H=(H1-H0)*HH, cols=`grid-template-columns:54px repeat(${days.length},minmax(0,1fr))`;
  const now=new Date(), nowM=now.getHours()*60+now.getMinutes(), hasToday=days.includes(t);
  const we=d=>parseD(d).getDay()%6===0;
  const head=days.map(d=>{ const dd=parseD(d); return `<button class="${d===t?"td":""}${we(d)?" we":""}" data-act="goday" data-day="${d}">${WD[dd.getDay()]}<b>${dd.getDate()}</b></button>`; }).join("");
  const un=days.map(d=>eventsOn(d).filter(e=>tmin(e.time)==null)), pc=days.map(d=>counts(callsFor(d)));
  const allday=(un.some(a=>a.length)||pc.some(c=>c.total)) ? `<div class="adr" style="${cols}"><span class="adl">kun bo'yi</span>${un.map((a,i)=>`<div class="adc">${pc[i].total?`<button class="evc plc" data-act="gocalls" data-day="${days[i]}">${pc[i].done}/${pc[i].total} qo'ng'iroq</button>`:""}${a.map(e=>`<button class="evc ${evCls(e)}${e.done?" dn":""}" data-act="evedit" data-id="${esc(e.id)}">${esc(e.title||EV_TYPES[e.type]||"")}</button>`).join("")}</div>`).join("")}</div>` : "";
  let times=""; for(let hh=1;hh<24;hh++) times+=`<span style="top:${hh*HH}px">${pad(hh)}:00</span>`;
  if(hasToday) times+=`<span class="nowl" style="top:${nowM/60*HH}px">${nowTime()}</span>`;
  const body=days.map(d=>{
    const evs=eventsOn(d).filter(e=>tmin(e.time)!=null).map(e=>({e,a:tmin(e.time),z:evEnd(e)}));
    const lanes=[]; for(const x of evs){ let i=lanes.findIndex(end=>end<=x.a); if(i<0){ i=lanes.length; lanes.push(0); } lanes[i]=x.z; x.lane=i; }
    const wdt=97/Math.max(lanes.length,1);
    let h=evs.map(x=>{ const top=x.a/60*HH, ht=Math.max(22,(x.z-x.a)/60*HH-2), cl=x.e.clientId?state.clients.get(x.e.clientId):null;
      return `<button class="evb ${evCls(x.e)}${x.e.done?" dn":""}" data-act="evedit" data-id="${esc(x.e.id)}" style="top:${top}px;height:${ht}px;left:${1+x.lane*wdt}%;width:${wdt-1}%"><b>${esc(x.e.title||EV_TYPES[x.e.type]||"")}</b><span>${esc(evSpan(x.e))}${cl?" · "+esc(cl.name):""}</span></button>`; }).join("");
    if(d===t) h+=`<div class="nowline" style="top:${nowM/60*HH}px"></div>`;
    return `<div class="dcol${d===t?" td":""}${we(d)?" we":""}" data-act="gridnew" data-day="${d}" style="height:${H}px">${h}</div>`;
  }).join("");
  return `<div class="card calc"><div class="wkh" style="${cols}"><span></span>${head}</div>${allday}<div class="wkscroll"><div class="wkg" style="${cols}"><div class="tcol" style="height:${H}px">${times}</div>${body}</div></div></div>`;
}
function monthGrid(){
  const t=todayStr(), cd=parseD(state.calDay), y=cd.getFullYear(), m=cd.getMonth();
  const off=(new Date(y,m,1).getDay()+6)%7, weeks=Math.ceil((off+new Date(y,m+1,0).getDate())/7);
  let h=`<div class="card"><div class="mhd">${WD1.map(x=>`<span>${x}</span>`).join("")}</div><div class="mgrid" style="grid-template-rows:repeat(${weeks},minmax(112px,1fr))">`;
  for(let i=0;i<weeks*7;i++){
    const d=new Date(y,m,1-off+i), ds=dstr(d), evs=eventsOn(ds);
    h+=`<div class="mc${d.getMonth()!==m?" out":""}" data-act="monthnew" data-day="${ds}"><button class="mn${ds===t?" td":""}" data-act="goday" data-day="${ds}">${d.getDate()}</button>${(()=>{ const c=counts(callsFor(ds)); return c.total?`<button class="me2 plc2" data-act="gocalls" data-day="${ds}"><i class="dot"></i>${c.done}/${c.total} qo'ng'iroq</button>`:""; })()}${evs.slice(0,3).map(e=>`<button class="me2 ${evCls(e)}${e.done?" dn":""}" data-act="evedit" data-id="${esc(e.id)}"><i class="dot" style="background:${EVC[e.type]||"var(--ink3)"}"></i>${e.time?`<em>${esc(e.time)}</em>`:""}${esc(e.title||EV_TYPES[e.type]||"")}</button>`).join("")}${evs.length>3?`<button class="mmore" data-act="goday" data-day="${ds}">yana ${evs.length-3} ta</button>`:""}</div>`;
  }

function yearGrid(){
  const t=todayStr(), y=parseD(state.calDay).getFullYear();
  const has=new Set([...state.events.values()].map(e=>e.date));
  let h=`<div class="ygrid">`;
  for(let m=0;m<12;m++){

    h+=`<div class="card mini"><button class="ym" data-act="gomonth" data-day="${y}-${pad(m+1)}-01">${cap1(MF[m])}</button><div class="mg">${["D","S","C","P","J","S","Y"].map(x=>`<i>${x}</i>`).join("")}${cells}</div></div>`;
  }
  return h+`</div>`;
}
function renderKalendar(){
  const t=todayStr(); if(!state.calDay) state.calDay=t;
  if(state.db) syncWeekSubs();
  const start=addDays(state.calDay, -((parseD(state.calDay).getDay()+6)%7));
  const days=[...Array(7)].map((_,i)=>addDays(start,i));
  if(!isWide()){
    return `<div class="chipsrow">
      <button class="chip" data-act="calshift" data-n="-7" aria-label="Oldingi hafta">‹</button>
      ${days.map(d=>{ const n=eventsOn(d).filter(e=>!e.done).length, dd=parseD(d); return `<button class="chip dayc${d===t?" today":""}" data-act="calday" data-day="${d}" aria-pressed="${d===state.calDay}">${WD[dd.getDay()]}<b>${dd.getDate()}</b>${n?`<small>${n}</small>`:""}</button>`; }).join("")}
      <button class="chip" data-act="calshift" data-n="7" aria-label="Keyingi hafta">›</button>
    </div><div class="col">${dayCard()}${upcomingCard()}</div>`;
  }
  const v=state.calView, cd=parseD(state.calDay), y=cd.getFullYear();
  const title=v==="day" ? `${dFull(state.calDay)} ${y}` : v==="week" ? `${dLabel(days[0])} – ${dLabel(days[6])} ${y}` : v==="month" ? `${cap1(MF[cd.getMonth()])} ${y}` : String(y);

const QN=s=>String(s||"").toLowerCase().replace(/[‘’`ʻʼ´]/g,"'").replace(/ё/g,"е").replace(/[«»"]/g," ").replace(/\s+/g," ").trim();
const QTR={а:"a",б:"b",в:"v",г:"g",д:"d",е:"e",ж:"j",з:"z",и:"i",й:"y",к:"k",л:"l",м:"m",н:"n",о:"o",п:"p",р:"r",с:"s",т:"t",у:"u",ф:"f",х:"x",ц:"ts",ч:"ch",ш:"sh",щ:"sh",ъ:"",ы:"i",ь:"",э:"e",ю:"yu",я:"ya",ў:"o",қ:"q",ғ:"g",ҳ:"h"};

const QGEN=new Set("dental dent denta clinic klinika klinikasi stom stoma stomatologiya stomatology med medical medline plus service servis serves center centr markaz markazi shifo smile family premium doctor doktor lab and the new".split(" "));

let qIndex=null;
function buildQIndex(){

    for(const w of ws) if(w.length>=4 && !QGEN.has(w)){ if(!words.has(w)) words.set(w,[]); words.get(w).push(c); }

    }
  }

    if(qWordHit(tok,w)) for(const c of cs){ const s=10+w.length-cs.length*2+(c.st==="faol"?2:0)-(tok.startsWith(w)?0:3); if(!found.has(c.id)||found.get(c.id).score<s) found.set(c.id,{c,score:s}); }

const QRE={
  pay:/to'la(di|b|gan|dim|shdi|shibdi|bdi)|to'lov qil|pul (tashla|o'tkaz)|оплатил|заплатил|перев[её]л|перевели|скинул|оплата пришла|оплачено/,
  past:/(dim|ldi|di|ibdi|ekan|yapti|madi|mabdi|gan)\b|(ил|ила|или|ал|ала|али|ел|ела|ели)(?![а-я])/,
  kot:/ko'tarmad|olmad|javob berma|o'chirilgan|aloqa yo'q|не ответил|не ответила|не взял|не берет|не берут|недоступ|не дозвон|сбросил|вне зоны/,
  rad:/rad et|kerak emas|qiziqma|xohlama|отказал|не нужно|не интерес|не хотят|не хочет/,
  muammo:/muammo|ishlamay|kelmay|xato|chiqmay|ochilmay|bormay|проблем|не работает|не приходит|не приходят|ошибк|не отправля|не открыва|не грузит|баг/,
  noprob:/muammo yo'q|проблем нет|без проблем/,
  zoom:/\bzoom|demo|зум|демо/,
  meet:/uchrash|встреч/,
  tg:/telegram|\btg\b|yozib|телеграм|написал/,
  call:/qo'ng'iroq|gaplash|telefon|suhbat|позвон|звонил|созвон|поговор|дозвонил|разговар|обсудил/,
  evpay:/to'lov|havola|hisob|schyot|invoice|qarz|оплат|сч[её]т|ссылк|долг|напомн/,
  support:/support|dasturchi|tuzat|поддержк|программист|исправ|техник/,
  evcall:/qo'ng'iroq|telefon|bog'lan|gaplash|позвон|созвон|перезвон|связат|набрать/
};
function qPast(n,c){
  const cw=c?qWords(c.name):[];
  return n.split(/[^a-z'а-я]+/).some(w=>w.length>=4 && (/(dim|ldi|ibdi|ekan|yapti|madi|mabdi|gan|di)$/.test(w) || /(ил|ила|или|ал|ала|али|ел|ела|ели|лся|лась|лись)$/.test(w)) && !cw.some(x=>qWordHit(qLat(w),x)));
}
function qParse(text){
  const out=[], t=todayStr();
  const parts=String(text||"").split(/(?<=[.!?;])\s+|\n+/).map(x=>x.trim()).filter(x=>x.length>2);
  let last=null;
  for(const raw of parts){
    const n=QN(raw), cands=qFindClients(raw);
    let c=cands[0]||null, inherited=false;
    if(!c && last){ c=last; inherited=true; }
    if(cands[0]) last=cands[0];
    const cl=c?c.id:"", alt=(cands.length?cands:c?[c]:[]).slice(0,5).map(x=>x.id);
    const fut=qDate(n), past=qPast(n,c);
    const isPay=QRE.pay.test(n) && qAmount(n)>0;
    const base={src:raw, cands:alt, clientId:cl, inherited, on:true};
    if(c && (!fut || past)){
      const type=QRE.zoom.test(n)?"zoom":QRE.meet.test(n)?"meet":QRE.tg.test(n)?"tg":isPay?"pay":QRE.call.test(n)?"call":"note";
      const hi=out.push({...base, kind:"hist", type, text:raw.replace(/\s+/g," "), tags:qTags(n)})-1;
      const call=[...state.calls.values()].find(x=>x.day===t && clientForCall(x)===c);
      let st=null;
      if(QRE.kot.test(n)) st="kot";
      else if(QRE.rad.test(n)) st="rad";
      else if(QRE.muammo.test(n) && !QRE.noprob.test(n)) st="muammo";
      else if(isPay||/yillik|годов/.test(n)) st="tolov";
      else if(QRE.zoom.test(n)) st="zoom";
      else if(QRE.call.test(n)) st="gap";
      if(st && out[hi].type==="note") out[hi].type="call";
      if(call && st && (call.st||"kut")!==st) out.push({...base, kind:"status", callId:call.id, st});
    }
    if(isPay && c){ const mo=qMonths(n)||Number((c.billing||{}).periodMonths)||1; out.push({...base, kind:"pay", amount:qAmount(n), months:mo, ext:!(Number((c.billing||{}).outstanding)>0), date:t}); }
    if(fut){
      const type=QRE.zoom.test(n)?"zoom":QRE.meet.test(n)?"meet":QRE.evpay.test(n)?"pay":QRE.support.test(n)?"support":QRE.evcall.test(n)?"call":"task";
      let title=raw.replace(/\s+/g," ").replace(/[.!?;]+$/,""); if(title.length>90) title=title.slice(0,88)+"…";
      out.push({...base, clientId:cl, kind:"event", type, title, date:fut, time:qTime(n)});
    }
    if(!c && !fut) out.push({...base, kind:"hist", type:"note", text:raw, tags:qTags(n), on:false});
  }
  return out;
}

let qRec=null;
const qLang=()=>{ try{ return localStorage.getItem("zq-lang")||"uz-UZ"; }catch(_){ return "uz-UZ"; } };
function qMicReset(msg){
  const r=qRec; qRec=null;
  if(r){ r.onend=null; r.onerror=null; r.onresult=null; try{ r.abort(); }catch(_){} }
  const btn=$("#q-mic"); if(btn){ btn.classList.remove("on"); btn.querySelector("span").textContent="Gapirish"; }
  if(msg!=null && $("#q-st")) $("#q-st").textContent=msg;
}
function qMic(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition, ta=$("#q-text"), btn=$("#q-mic"), st=$("#q-st"), sel=$("#q-lang");
  if(!SR){ ta.focus(); st.textContent=/Mac/.test(navigator.platform)?"Matn maydoni tayyor. Fn (🌐) tugmasini ikki marta bosib gapiring — Mac diktovkasi shu yerga yozadi.":"Klaviaturadagi 🎙 tugmasini bosib gapiring."; return; }
  if(qRec){ const r=qRec; try{ r.stop(); }catch(_){} setTimeout(()=>{ if(qRec===r) qMicReset(""); qRun(); },700); btn.classList.remove("on"); btn.querySelector("span").textContent="Gapirish"; return; }
  let r;
  try{
    r=new SR(); qRec=r; r.lang=(sel&&sel.value)||qLang(); r.continuous=true; r.interimResults=true;
    const base=ta.value?ta.value.replace(/\s*$/," "):"";
    r.onresult=e=>{ let fin="",tmp=""; for(const x of e.results) x.isFinal?(fin+=x[0].transcript.trim()+". "):(tmp+=x[0].transcript); ta.value=base+fin+tmp; };
    r.onerror=e=>{
      if(e.error==="no-speech"||e.error==="aborted") return;
      let msg;
      if(e.error==="not-allowed") msg="Mikrofonga ruxsat berilmadi. Tizim sozlamalarida ruxsat bering yoki Fn (🌐) ikki marta bosing.";
      else if(e.error==="language-not-supported"||e.error==="service-not-allowed"||e.error==="network"){
        if(sel && sel.value==="uz-UZ"){ sel.value="ru-RU"; try{ localStorage.setItem("zq-lang","ru-RU"); }catch(_){} msg="O'zbek tili bu yerda tanilmaydi — Ruschaga o'tkazdim. Yana «Gapirish»ni bosing yoki Fn (🌐) ikki marta bosing."; }
        else msg="Mikrofon bu yerda ishlamadi. Fn (🌐) tugmasini ikki marta bosib gapiring.";
      } else msg="Mikrofon ishlamadi ("+e.error+"). Fn (🌐) ikki marta bosib ko'ring.";
      qMicReset(msg);
    };
    r.onend=()=>{ if(qRec===r) qMicReset(""); qRun(); };
    r.start(); btn.classList.add("on"); btn.querySelector("span").textContent="To'xtatish"; st.textContent="Eshityapman…";
  }catch(e){ qMicReset("Mikrofon ishlamadi. Fn (🌐) ikki marta bosib ko'ring."); }
}
function qRun(){ const ta=$("#q-text"); if(!ta) return; state.qacts=qParse(ta.value); qRender(); }

async function qSave(){
  const A=state.qacts.filter(a=>a.on), err=$("#q-err"), t=todayStr();
  const bad=A.find(a=>a.kind!=="event" && !state.clients.has(a.clientId));
  if(bad){ err.textContent=`«${bad.src.slice(0,50)}» uchun mijoz tanlanmagan.`; return; }
  const badPay=A.find(a=>a.kind==="pay" && !a.amount); if(badPay){ err.textContent="To'lov summasini kiriting."; return; }
  let ok=0;
  try{
    for(const a of A){
      if(a.kind==="hist"){ await addHistory(a.clientId,{type:a.type, text:a.text, tags:a.tags||[], date:t}); ok++; }
      else if(a.kind==="status"){ await writeCall(a.callId,{st:a.st, clientId:a.clientId}); ok++; }
      else if(a.kind==="pay"){ await recordPayment(a.clientId, a.amount, a.date||t, a.ext, a.months); ok++; }
      else if(a.kind==="event"){ const id=uid("e"), d={type:a.type, clientId:a.clientId||null, title:a.title||EV_DEF[a.type]||EV_TYPES[a.type], date:a.date, time:a.time||"", timeEnd:a.time?minToT(tmin(a.time)+60):"", note:"", done:false, createdAt:new Date().toISOString()}; await state.db.doc("events/"+id).set(d); state.events.set(id,{id,...d}); ok++; }
    }
    closeSheet(); doRender(); setNotice(`${ok} ta yozuv saqlandi.`); setTimeout(()=>setNotice(""),4000);
  }catch(er){ err.textContent=(ok?`${ok} tasi saqlandi, keyingisida xato: `:"")+failMsg(er); }
}

/* ---------- writes ---------- */
const chains=new Map();
function chain(path, fn){ const p=(chains.get(path)||Promise.resolve()).then(fn); chains.set(path, p.catch(()=>{})); return p; }
function writeCall(id, patch){
  const c=state.calls.get(id); if(!c||!state.db) return Promise.resolve();
  Object.assign(c, patch);
  return chain("calls/"+id, ()=>state.db.doc("calls/"+id).update({...patch, updatedAt:new Date().toISOString()}))
    .then(()=>{ const s=document.getElementById("sv-"+id); if(s) s.textContent="Saqlandi"; })
    .catch(e=>setNotice(failMsg(e)));
}
function updateClient(id, patch){
  const c=state.clients.get(id); if(!c||!state.db) return Promise.resolve();
  Object.assign(c, patch);
  return chain("clients/"+id, ()=>state.db.doc("clients/"+id).update(patch)).catch(e=>setNotice(failMsg(e)));
}
async function addHistory(clientId, entry){
  if(!clientId||!state.db) return;
  const id=uid("h");
  const data={date:entry.date||todayStr(), at:new Date().toISOString(), type:entry.type||"note", text:entry.text||"", tags:entry.tags||[], ...(entry.callId?{callId:entry.callId}:{}), ...(entry.eventId?{eventId:entry.eventId}:{})};
  await state.db.doc("clients/"+clientId+"/history/"+id).set(data);
  const c=state.clients.get(clientId);
  if(c && (!c.lastContactAt || data.date>=c.lastContactAt)) await updateClient(clientId,{lastContactAt:data.date, lastContactText:(data.text||"").slice(0,140)});
  return id;
}
const timers={};
function debounceField(id, field, value){
  clearTimeout(timers[id+field]);
  const s=document.getElementById("sv-"+id); if(s) s.textContent="Yozilmoqda…";
  timers[id+field]=setTimeout(()=>{ if((state.calls.get(id)||{})[field]!==value) writeCall(id,{[field]:value}); else if(s) s.textContent=""; },700);
}
async function syncCallHistory(id){
  const c=state.calls.get(id); if(!c) return;
  const cl=clientForCall(c); if(!cl) return;
  const s=c.st||"kut"; if(s==="kut") return;
  const text=[ST_LABEL[s], (c.note||"").trim()].filter(Boolean).join(". ");
  try{
    if(c.histId){ await chain("clients/"+cl.id+"/history/"+c.histId, ()=>state.db.doc("clients/"+cl.id+"/history/"+c.histId).update({text, date:c.day||todayStr()})); }
    else { const hid=await addHistory(cl.id,{type:"call", text, date:todayStr(), callId:id}); if(hid) await writeCall(id,{histId:hid, clientId:cl.id}); }
    await updateClient(cl.id,{lastContactAt:todayStr(), lastContactText:text.slice(0,140)});
  }catch(e){ setNotice(failMsg(e)); }
}

/* ---------- history: trackpad swipe / ⌘[ / mouse back ---------- */
let navRestoring=false, navSkip=false;
const NAVK={all:["tab"], bugun:["bq"], kalendar:["calView","calDay"], mijozlar:["cf","selClient"], tolovlar:["pf","pm"], reja:["rweek","day","rejaView"]};
function navSnap(){ const v={tab:state.tab}; for(const k of (NAVK[state.tab]||[])) v[k]=state[k]??null; return v; }
function navSync(){
  if(navRestoring||!state.db) return;
  const v=navSnap(), hs=history.state, sheet=!$("#ov").hidden;
  if(!hs||!hs.v){ history.replaceState({v,sheet},""); return; }
  if(JSON.stringify(hs.v)!==JSON.stringify(v)) history.pushState({v,sheet},"");
}
new MutationObserver(()=>{
  if(navRestoring||!state.db) return;
  const open=!$("#ov").hidden, hs=history.state||{};
  if(open && !hs.sheet) history.pushState({v:navSnap(),sheet:true},"");
  else if(!open && hs.sheet){ navSkip=true; history.back(); }
}).observe($("#ov"),{attributes:true,attributeFilter:["hidden"]});
addEventListener("popstate", e=>{
  if(navSkip){ navSkip=false; return; }
  const st=e.state; if(!state.db) return;
  navRestoring=true;
  try{
    if(!$("#ov").hidden && !(st&&st.sheet)){ state.confirmDel=null; closeSheet(); }
    if(st&&st.v){
      const prevW=state.rweek, prevTab=state.tab;
      for(const [k,val] of Object.entries(st.v)) if(val!=null) state[k]=val;
      if(state.rweek!==prevW) syncWeekSubs();
      state.open=null; doRender(); if(state.tab!==prevTab) window.scrollTo({top:0});
    }
  } finally { setTimeout(()=>{ navRestoring=false; },0); }
});

const COLS={
  clients:["id","name","site_id","domain","st","phone","contact","users","users_note","billing","last_contact_at","last_contact_text","created_at","updated_at"],
  history:["id","client_id","date","type","text","tags","call_id","event_id","created_at"],

};
const toSnake=k=>k.replace(/[A-Z]/g,m=>"_"+m.toLowerCase());
const toCamel=k=>k.replace(/_([a-z])/g,(_,c)=>c.toUpperCase());
function toRow(table,obj){
  const r={};
  for(const [k,v] of Object.entries(obj)){
    let sk=toSnake(k);
    if(table==="history" && k==="at") sk="created_at";
    if(COLS[table].includes(sk)) r[sk]=(v===""&&/_at$|^date$|^day$/.test(sk))?null:v;
  }
  if(table==="clients" && "billing" in r && r.billing==null) r.billing={};
  return r;
}
function fromRow(table,row){
  const o={};
  for(const [k,v] of Object.entries(row)){ if(v===null) continue; o[table==="history"&&k==="created_at"?"at":toCamel(k)]=v; }
  if(table==="calls" && o.ord!=null) o.ord=Number(o.ord);
  if(table==="payments" && o.amount!=null) o.amount=Number(o.amount);
  return o;
}
/* Path → table. Keeps the old document-style API so the app code above stays unchanged. */
function parsePath(path){
  const p=path.split("/");
  if(p[0]==="meta" && p[1]==="plan") return {table:"plans", plan:true};
  if(p[0]==="plans") return {table:"plans", id:p[1], key:"week"};
  if(p[0]==="clients" && p[2]==="history") return {table:"history", id:p[3], parent:p[1]};
  return {table:p[0], id:p[1]};
}
function makeDb(sb){
  const chk=({data,error})=>{ if(error) throw error; return data; };
  const live=(key, filter, refetch)=>{
    let t=null; const kick=()=>{ clearTimeout(t); t=setTimeout(refetch,250); };
    const ch=sb.channel(key+":"+Math.random().toString(36).slice(2)).on("postgres_changes",{event:"*",schema:"public",table:filter.table,...(filter.f?{filter:filter.f}:{})},kick).subscribe();
    const vis=()=>{ if(document.visibilityState==="visible") kick(); };
    document.addEventListener("visibilitychange",vis);
    return ()=>{ clearTimeout(t); sb.removeChannel(ch); document.removeEventListener("visibilitychange",vis); };
  };
  function doc(path){
    const P=parsePath(path);
    if(P.plan){
      const q=()=>sb.from("plans").select("*").eq("is_current",true).limit(1).maybeSingle();
      return {
        update: async patch=>chk(await sb.from("plans").update({...toRow("plans",patch), updated_at:new Date().toISOString()}).eq("is_current",true)),
        onSnapshot(cb,err){
          const run=async()=>{ try{ const d=chk(await q()); cb({exists:!!d, data:()=>d?fromRow("plans",d):null}); }catch(e){ err&&err(e); } };
          run(); return live("plan",{table:"plans"},run);
        }
      };
    }
    const K=P.key||"id"; const base=()=>{ let r={[K]:P.id}; if(P.parent) r.client_id=P.parent; return r; };
    return {
      set: async data=>chk(await sb.from(P.table).upsert({...toRow(P.table,data), ...base()})),
      update: async patch=>{ const row=toRow(P.table,patch); if(!Object.keys(row).length) return; chk(await sb.from(P.table).update(row).eq(K,P.id)); },
      delete: async ()=>chk(await sb.from(P.table).delete().eq(K,P.id))
    };
  }
  function collection(path){
    const P=parsePath(path); const filters=[];
    if(P.parent) filters.push(["client_id",P.parent]);
    const api={
      where(field,op,val){ filters.push([toSnake(field),val]); return api; },
      onSnapshot(cb,err){
        const run=async()=>{
          try{
            let q=sb.from(P.table).select("*").limit(5000);
            for(const [f,v] of filters) q=q.eq(f,v);
            const rows=chk(await q);
            cb({docs:rows.map(r=>({id:r.id??r.week, data:()=>{ const o=fromRow(P.table,r); delete o.id; return o; }}))});
          }catch(e){ err&&err(e); }
        };
        run();
        const f=filters.length===1?`${filters[0][0]}=eq.${filters[0][1]}`:null;
        return live(path,{table:P.table,f},run);
      }
    };
    return api;
  }
  return {doc, collection};
}

const callSubs=new Map(), callsByWeek=new Map();
function rebuildCalls(){ const m=new Map(); for(const mm of callsByWeek.values()) for(const [k,v] of mm) m.set(k,v); state.calls=m; }
function watchWeek(w){
  if(!w||callSubs.has(w)||!state.db) return;
  callSubs.set(w,null);
  const u=state.db.collection("calls").where("week","==",w).onSnapshot(snap=>{
    if(!callSubs.has(w)) return;
    const m=new Map(); for(const d of snap.docs) m.set(d.id,{id:d.id,...d.data()}); callsByWeek.set(w,m); rebuildCalls(); render();
  }, ()=>setNotice("Qo'ng'iroqlar rejasini o'qib bo'lmadi."));
  if(callSubs.has(w)) callSubs.set(w,u); else u();
}
function syncWeekSubs(){
  const keep=new Set([state.curWeek, state.plan&&state.plan.week, state.rweek, weekShift(state.curWeek,1), ...(state.tab==="kalendar"&&state.calDay?(state.calView==="month"?[...Array(6)].map((_,i)=>isoWeek(addDays(state.calDay.slice(0,8)+"01",7*i))):[isoWeek(state.calDay)]):[])].filter(Boolean));
  for(const [w,u] of [...callSubs]) if(!keep.has(w)){ callSubs.delete(w); callsByWeek.delete(w); if(u) u(); }
  keep.forEach(watchWeek); rebuildCalls();
}
function subscribeCalls(){ syncWeekSubs(); }
function startData(db){
  document.body.classList.remove("auth");
  const timer=setTimeout(()=>setNotice("Ma'lumotlarga hali ulanib bo'lmadi. Internetni tekshiring, sahifa o'zi qayta urinadi."),10000);
  state.db=db;
  db.doc("meta/plan").onSnapshot(snap=>{
    clearTimeout(timer); setNotice("");
    if(!snap.exists){ state.plan=null; render(); return; }
    const p=snap.data(); const changed=!state.plan||state.plan.week!==p.week; state.plan=p;
    if(!state.day) state.day=todayStr();
    if(changed) subscribeCalls(p.week);
    render();
  }, ()=>{ clearTimeout(timer); setNotice("Rejani o'qib bo'lmadi."); });
  db.collection("payments").onSnapshot(snap=>{
    const m=new Map(); for(const d of snap.docs) m.set(d.id,{id:d.id,...d.data()}); state.payments=m; render();
  }, ()=>{});
  db.collection("plans").onSnapshot(snap=>{
    const m=new Map(); for(const d of snap.docs) m.set(d.id,{...d.data(), week:d.id}); state.plans=m; render();
  }, ()=>{});
  syncWeekSubs();
  db.collection("clients").onSnapshot(snap=>{
    clearTimeout(timer);
    const m=new Map(); for(const d of snap.docs) m.set(d.id,{id:d.id,...d.data()}); state.clients=m; render();
    if(state.sheet&&state.sheet.kind==="client") renderSheetSafe();
  }, ()=>setNotice("Mijozlar ro'yxatini o'qib bo'lmadi."));
  db.collection("events").onSnapshot(snap=>{
    const m=new Map(); for(const d of snap.docs) m.set(d.id,{id:d.id,...d.data()}); state.events=m; render();
    if(state.sheet&&state.sheet.kind==="client") renderSheetSafe();
  }, ()=>setNotice("Kalendarni o'qib bo'lmadi."));
  doRender();
}
